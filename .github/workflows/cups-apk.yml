name: Build CUPS for OpenWrt 25.12.2 x86_64

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cups-apk.yml'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本号'
        required: true
        default: '25.12.2'
      target:
        description: '目标平台'
        required: true
        default: 'x86/64'
      create_release:
        description: '是否创建 Release'
        type: boolean
        default: true

# 授予 Release 权限
permissions:
  contents: write

env:
  OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.2' }}
  TARGET: ${{ github.event.inputs.target || 'x86/64' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            python3-pyelftools unzip wget rsync subversion swig time xsltproc zlib1g-dev \
            zstd

      - name: 解析 SDK 信息
        id: parse
        run: |
          TARGET_ARCH=$(echo "$TARGET" | cut -d'/' -f1)
          SUBTARGET=$(echo "$TARGET" | cut -d'/' -f2)
          echo "target_arch=$TARGET_ARCH" >> $GITHUB_OUTPUT
          echo "subtarget=$SUBTARGET" >> $GITHUB_OUTPUT
          
          SDK_BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET_ARCH}/${SUBTARGET}/"
          SDK_FILENAME=$(curl -sL "$SDK_BASE_URL" | grep -oP 'openwrt-sdk-[^"]+\.tar\.zst' | head -1)
          
          if [ -z "$SDK_FILENAME" ]; then
            echo "::error::无法找到 SDK 文件"
            exit 1
          fi
          
          echo "sdk_url=${SDK_BASE_URL}${SDK_FILENAME}" >> $GITHUB_OUTPUT
          echo "SDK: $SDK_FILENAME"

      - name: 缓存 SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ steps.parse.outputs.target_arch }}-${{ steps.parse.outputs.subtarget }}

      - name: 下载并解压 SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ steps.parse.outputs.sdk_url }}" -O sdk.tar.zst
          mkdir -p sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          echo "SDK 解压完成"

      - name: 添加包含 CUPS 的第三方 feed
        working-directory: sdk
        run: |
          # 备份原 feeds.conf
          cp feeds.conf.default feeds.conf.default.bak
          
          # 添加 coolsnowwolf/packages feed（包含 cups、ghostscript、gutenprint）
          # 该 feed 是 Lean OpenWrt 的 packages，维护了大量官方已移除的包
          echo "src-git cupsfeed https://github.com/coolsnowwolf/packages.git" >> feeds.conf.default
          
          # 也可以使用 OpenWrt 23.05 旧版 packages feed（仍包含 cups）
          # echo "src-git cupsfeed https://github.com/openwrt/packages.git;openwrt-23.05" >> feeds.conf.default
          
          echo "=== feeds.conf ==="
          cat feeds.conf.default

      - name: 更新 feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          
          echo "=== 检查 cups 相关包是否可用 ==="
          ./scripts/feeds list | grep -iE 'cups|ghostscript|gutenprint' || echo "未找到，继续尝试安装"

      - name: 安装 CUPS 相关包到编译树
        working-directory: sdk
        run: |
          # 安装 cups 及其依赖
          ./scripts/feeds install -a -p cupsfeed
          
          # 强制安装 cups 相关包
          ./scripts/feeds install cups
          ./scripts/feeds install cups-filters
          ./scripts/feeds install ghostscript
          ./scripts/feeds install gutenprint
          
          echo "=== 验证包已安装 ==="
          ls -la package/feeds/cupsfeed/ 2>/dev/null | grep -iE 'cups|ghostscript|gutenprint' || \
          ls -la package/feeds/ | head -20

      - name: 配置编译选项
        working-directory: sdk
        run: |
          # 生成默认配置
          make defconfig
          
          # 启用 cups 相关包为模块（M）
          for pkg in cups cups-filters ghostscript gutenprint; do
            if grep -q "CONFIG_PACKAGE_${pkg}=" .config; then
              sed -i "s/# CONFIG_PACKAGE_${pkg} is not set/CONFIG_PACKAGE_${pkg}=m/" .config
              sed -i "s/CONFIG_PACKAGE_${pkg}=y/CONFIG_PACKAGE_${pkg}=m/" .config
            else
              echo "CONFIG_PACKAGE_${pkg}=m" >> .config
            fi
          done
          
          # 重新生成配置
          make defconfig
          
          echo "=== CUPS 相关配置 ==="
          grep -iE 'cups|ghostscript|gutenprint' .config

      - name: 编译 CUPS 及依赖
        working-directory: sdk
        run: |
          # 先编译工具链（首次需要）
          make toolchain/install -j$(nproc)
          
          # 编译 cups 及其所有依赖
          echo "=== 开始编译 cups ==="
          make package/feeds/cupsfeed/cups/compile V=s -j$(nproc) 2>&1 | tail -50
          
          echo "=== 开始编译 cups-filters ==="
          make package/feeds/cupsfeed/cups-filters/compile V=s -j$(nproc) 2>&1 | tail -50
          
          echo "=== 开始编译 ghostscript ==="
          make package/feeds/cupsfeed/ghostscript/compile V=s -j$(nproc) 2>&1 | tail -50
          
          echo "=== 开始编译 gutenprint ==="
          make package/feeds/cupsfeed/gutenprint/compile V=s -j$(nproc) 2>&1 | tail -50
          
          echo "=== 编译完成 ==="

      - name: 查找所有编译产物
        working-directory: sdk
        run: |
          echo "=== 所有 apk 文件 ==="
          find bin/ -name "*.apk" -type f 2>/dev/null
          
          echo ""
          echo "=== CUPS 相关 apk ==="
          find bin/ -iname "*cups*" -type f 2>/dev/null
          
          echo ""
          echo "=== ghostscript 相关 apk ==="
          find bin/ -iname "*ghostscript*" -o -iname "*gs*" -type f 2>/dev/null | head -20
          
          echo ""
          echo "=== gutenprint 相关 apk ==="
          find bin/ -iname "*gutenprint*" -type f 2>/dev/null

      - name: 收集编译产物
        id: collect
        run: |
          mkdir -p output
          
          # 收集所有 cups 相关 apk
          find sdk/bin/ -iname "*cups*" -name "*.apk" -exec cp {} output/ \; 2>/dev/null
          
          # 收集 ghostscript
          find sdk/bin/ -iname "*ghostscript*" -name "*.apk" -exec cp {} output/ \; 2>/dev/null
          
          # 收集 gutenprint
          find sdk/bin/ -iname "*gutenprint*" -name "*.apk" -exec cp {} output/ \; 2>/dev/null
          
          # 收集依赖库（libcups 等）
          find sdk/bin/ -iname "*libcups*" -name "*.apk" -exec cp {} output/ \; 2>/dev/null
          find sdk/bin/ -iname "*libgs*" -name "*.apk" -exec cp {} output/ \; 2>/dev/null
          
          echo "=== 产物列表 ==="
          ls -lh output/
          
          APK_COUNT=$(ls output/*.apk 2>/dev/null | wc -l)
          echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::未找到任何 apk 产物"
            exit 1
          fi

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cups-openwrt-${{ env.OPENWRT_VERSION }}-x86_64
          path: output/
          retention-days: 30

      - name: 生成 Release 说明
        if: ${{ github.event.inputs.create_release == 'true' || github.event_name == 'push' }}
        run: |
          cat > release.txt << EOF
          ## CUPS for OpenWrt ${{ env.OPENWRT_VERSION }} (x86_64)
          
          ### 编译信息
          | 项目 | 值 |
          |------|-----|
          | OpenWrt 版本 | ${{ env.OPENWRT_VERSION }} |
          | 目标平台 | x86/64 |
          | 架构 | x86_64 |
          | 包格式 | apk |
          | 产物数量 | ${{ steps.collect.outputs.apk_count }} 个 |
          
          ### 包含的软件包
          - cups - CUPS 打印系统核心
          - cups-filters - CUPS 过滤器
          - ghostscript - PostScript/PDF 渲染引擎
          - gutenprint - 打印机驱动集合（含佳能 PIXMA 系列）
          - libcups - CUPS 库
          
          ### 安装方法
          \`\`\`bash
          # 1. 上传所有 apk 到路由器
          scp *.apk root@192.168.1.1:/tmp/
          
          # 2. SSH 登录并安装
          ssh root@192.168.1.1
          cd /tmp
          
          # 按依赖顺序安装
          opkg install libcups*.apk
          opkg install ghostscript*.apk
          opkg install gutenprint*.apk
          opkg install cups-filters*.apk
          opkg install cups*.apk
          \`\`\`
          
          ### 适用场景
          - USB 打印机共享（Windows + Android 无线打印）
          - Android 通过 IPP 协议打印（Mopria Print Service）
          - Windows 通过 IPP 或 RAW 9100 打印
          
          > 自动编译于 GitHub Actions
          > 编译时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          
          cat release.txt

      - name: 发布到 GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: cups-openwrt-${{ env.OPENWRT_VERSION }}-x86_64
          name: CUPS for OpenWrt ${{ env.OPENWRT_VERSION }} (x86_64)
          body_path: release.txt
          files: output/*.apk
          draft: false
          prerelease: false
          overwrite_files: false
          fail_on_unmatched_files: true
