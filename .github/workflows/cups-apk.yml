name: Build CUPS for OpenWrt 25.12.2 x86_64 (混合 feed 修复版)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cups-apk.yml'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt SDK 版本号'
        required: true
        default: '25.12.2'
      target:
        description: '目标平台 (target/subtarget)'
        required: true
        default: 'x86/64'
      create_release:
        description: '是否创建 GitHub Release'
        type: boolean
        default: true

# 授予创建 Release 的权限
permissions:
  contents: write

env:
  OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.2' }}
  TARGET: ${{ github.event.inputs.target || 'x86/64' }}
  # Feed 1: OpenWrt 23.05 官方（含 cups, cups-filters, ghostscript）
  FEED1_NAME: openwrt2305
  FEED1_URL: https://github.com/openwrt/packages.git
  FEED1_BRANCH: openwrt-23.05
  # Feed 2: coolsnowwolf（含 gutenprint，作为补充）
  FEED2_NAME: coolsnowwolf
  FEED2_URL: https://github.com/coolsnowwolf/packages.git

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            python3-pyelftools unzip wget rsync subversion swig time xsltproc zlib1g-dev \
            zstd

      - name: 解析 SDK 信息
        id: parse
        run: |
          TARGET_ARCH=$(echo "$TARGET" | cut -d'/' -f1)
          SUBTARGET=$(echo "$TARGET" | cut -d'/' -f2)
          echo "target_arch=$TARGET_ARCH" >> $GITHUB_OUTPUT
          echo "subtarget=$SUBTARGET" >> $GITHUB_OUTPUT
          
          SDK_BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET_ARCH}/${SUBTARGET}/"
          SDK_FILENAME=$(curl -sL "$SDK_BASE_URL" | grep -oP 'openwrt-sdk-[^"]+\.tar\.zst' | head -1)
          
          if [ -z "$SDK_FILENAME" ]; then
            echo "::error::无法找到 SDK 文件"
            exit 1
          fi
          
          echo "sdk_url=${SDK_BASE_URL}${SDK_FILENAME}" >> $GITHUB_OUTPUT
          echo "SDK: $SDK_FILENAME"

      - name: 缓存 SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ steps.parse.outputs.target_arch }}-${{ steps.parse.outputs.subtarget }}

      - name: 下载并解压 SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ steps.parse.outputs.sdk_url }}" -O sdk.tar.zst
          mkdir -p sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1
          echo "SDK 解压完成"

      # ============================================================
      # 关键修复：配置双 feed（混合模式）
      # ============================================================
      - name: 配置双 feed（23.05官方 + coolsnowwolf补充）
        working-directory: sdk
        run: |
          echo "=== 原始 feeds.conf.default ==="
          cat feeds.conf.default
          
          echo ""
          echo "=== 添加 Feed 1: OpenWrt 23.05 官方 ==="
          echo "src-git ${FEED1_NAME} ${FEED1_URL};${FEED1_BRANCH}" >> feeds.conf.default
          
          echo "=== 添加 Feed 2: coolsnowwolf（补充 gutenprint）==="
          echo "src-git ${FEED2_NAME} ${FEED2_URL}" >> feeds.conf.default
          
          echo ""
          echo "=== 最终 feeds.conf.default ==="
          cat feeds.conf.default
          
          echo ""
          echo "=== Feed 说明 ==="
          echo "${FEED1_NAME}: ${FEED1_URL} (${FEED1_BRANCH}) - 提供 cups, cups-filters, ghostscript"
          echo "${FEED2_NAME}: ${FEED2_URL} - 提供 gutenprint（23.05官方源缺失）"

      - name: 更新 feeds
        working-directory: sdk
        run: |
          echo "=== 更新所有 feeds ==="
          ./scripts/feeds update -a 2>&1 | tail -30
          
          echo ""
          echo "=== 检查各 feed 中的 CUPS 相关包 ==="
          echo "--- Feed 1 (${FEED1_NAME}) ---"
          ./scripts/feeds list -d 2>/dev/null | grep "^${FEED1_NAME}/" | grep -iE 'cups|ghostscript|gutenprint' || echo "  (无匹配)"
          
          echo "--- Feed 2 (${FEED2_NAME}) ---"
          ./scripts/feeds list -d 2>/dev/null | grep "^${FEED2_NAME}/" | grep -iE 'cups|ghostscript|gutenprint' || echo "  (无匹配)"
          
          echo ""
          echo "=== 所有可用的 cups 相关包 ==="
          ./scripts/feeds list | grep -iE 'cups|ghostscript|gutenprint' || echo "未找到"

      # ============================================================
      # 智能安装：优先从 feed1 安装，缺失的从 feed2 安装
      # ============================================================
      - name: 智能安装 CUPS 相关包（自动回退）
        working-directory: sdk
        run: |
          # 定义需要安装的包列表
          PACKAGES="cups cups-filters ghostscript gutenprint"
          
          for pkg in $PACKAGES; do
            echo ""
            echo "=== 安装包: $pkg ==="
            
            # 尝试从 Feed 1 (23.05官方) 安装
            if ./scripts/feeds list -d 2>/dev/null | grep -q "^${FEED1_NAME}/${pkg}"; then
              echo "  → 从 ${FEED1_NAME} (23.05官方) 安装"
              ./scripts/feeds install -p ${FEED1_NAME} $pkg 2>&1 | tail -5
            # 尝试从 Feed 2 (coolsnowwolf) 安装
            elif ./scripts/feeds list -d 2>/dev/null | grep -q "^${FEED2_NAME}/${pkg}"; then
              echo "  → 从 ${FEED2_NAME} (coolsnowwolf) 安装"
              ./scripts/feeds install -p ${FEED2_NAME} $pkg 2>&1 | tail -5
            # 都没有，尝试默认安装
            else
              echo "  → 两个 feed 都没有，尝试默认安装"
              ./scripts/feeds install $pkg 2>&1 | tail -5
            fi
          done
          
          echo ""
          echo "=== 已安装的包（package/feeds/ 目录）==="
          for feed in ${FEED1_NAME} ${FEED2_NAME}; do
            echo "--- $feed ---"
            ls package/feeds/$feed/ 2>/dev/null | grep -iE 'cups|ghostscript|gutenprint' || echo "  (无)"
          done
          
          echo ""
          echo "=== 各包的实际来源 ==="
          for pkg in cups cups-filters ghostscript gutenprint; do
            SRC=$(find package/feeds/ -maxdepth 2 -name "Makefile" -path "*/$pkg" 2>/dev/null | head -1)
            if [ -n "$SRC" ]; then
              echo "  $pkg → $SRC"
            else
              echo "  $pkg → 未找到!"
            fi
          done

      - name: 配置编译选项
        working-directory: sdk
        run: |
          make defconfig
          
          # 启用所有 CUPS 相关包
          PACKAGES="cups cups-filters ghostscript gutenprint libcups"
          for pkg in $PACKAGES; do
            if grep -q "CONFIG_PACKAGE_${pkg}=" .config; then
              sed -i "s/# CONFIG_PACKAGE_${pkg} is not set/CONFIG_PACKAGE_${pkg}=m/" .config
              sed -i "s/CONFIG_PACKAGE_${pkg}=y/CONFIG_PACKAGE_${pkg}=m/" .config
            else
              echo "CONFIG_PACKAGE_${pkg}=m" >> .config
            fi
          done
          
          make defconfig
          
          echo "=== CUPS 相关配置 ==="
          grep -iE 'cups|ghostscript|gutenprint' .config

      - name: 编译工具链
        working-directory: sdk
        run: |
          make toolchain/install -j$(nproc) 2>&1 | tail -10
          echo "工具链编译完成"

      # ============================================================
      # 编译各包（动态查找路径）
      # ============================================================
      - name: 编译 CUPS 核心
        working-directory: sdk
        run: |
          CUPS_DIR=$(find package/feeds/ -maxdepth 2 -name "Makefile" -path "*cups" ! -path "*cups-filters*" | head -1 | xargs dirname)
          echo "CUPS 目录: $CUPS_DIR"
          
          if [ -z "$CUPS_DIR" ]; then
            echo "::error::未找到 cups 包"
            exit 1
          fi
          
          echo "=== 编译 CUPS ==="
          make $CUPS_DIR/compile V=s -j$(nproc) 2>&1 | tail -40
          echo "CUPS 编译退出码: $?"

      - name: 编译 cups-filters
        working-directory: sdk
        run: |
          CF_DIR=$(find package/feeds/ -maxdepth 2 -name "Makefile" -path "*cups-filters*" | head -1 | xargs dirname)
          echo "cups-filters 目录: $CF_DIR"
          
          if [ -z "$CF_DIR" ]; then
            echo "::warning::未找到 cups-filters，跳过"
            exit 0
          fi
          
          echo "=== 编译 cups-filters ==="
          make $CF_DIR/compile V=s -j$(nproc) 2>&1 | tail -40
          echo "cups-filters 编译退出码: $?"

      - name: 编译 ghostscript
        working-directory: sdk
        run: |
          GS_DIR=$(find package/feeds/ -maxdepth 2 -name "Makefile" -path "*ghostscript*" | head -1 | xargs dirname)
          echo "ghostscript 目录: $GS_DIR"
          
          if [ -z "$GS_DIR" ]; then
            echo "::warning::未找到 ghostscript，跳过"
            exit 0
          fi
          
          echo "=== 编译 ghostscript（耗时较长）==="
          make $GS_DIR/compile V=s -j$(nproc) 2>&1 | tail -40
          echo "ghostscript 编译退出码: $?"

      - name: 编译 gutenprint
        working-directory: sdk
        run: |
          GP_DIR=$(find package/feeds/ -maxdepth 2 -name "Makefile" -path "*gutenprint*" | head -1 | xargs dirname)
          echo "gutenprint 目录: $GP_DIR"
          
          if [ -z "$GP_DIR" ]; then
            echo "::error::未找到 gutenprint 包"
            echo "::error::请确认 coolsnowwolf feed 已正确添加"
            exit 1
          fi
          
          echo "=== 编译 gutenprint ==="
          make $GP_DIR/compile V=s -j$(nproc) 2>&1 | tail -40
          echo "gutenprint 编译退出码: $?"

      - name: 查找编译产物
        working-directory: sdk
        run: |
          echo "=== 所有 apk ==="
          find bin/ -name "*.apk" -type f 2>/dev/null | sort
          
          echo ""
          echo "=== CUPS 相关 ==="
          find bin/ -iname "*cups*" -type f 2>/dev/null | sort
          
          echo ""
          echo "=== ghostscript 相关 ==="
          find bin/ -iname "*ghostscript*" -o -iname "*libgs*" -type f 2>/dev/null | sort
          
          echo ""
          echo "=== gutenprint 相关 ==="
          find bin/ -iname "*gutenprint*" -type f 2>/dev/null | sort

      - name: 收集编译产物
        id: collect
        run: |
          mkdir -p output
          
          find sdk/bin/ -iname "*cups*" -name "*.apk" -exec cp {} output/ \; 2>/dev/null
          find sdk/bin/ -iname "*ghostscript*" -name "*.apk" -exec cp {} output/ \; 2>/dev/null
          find sdk/bin/ -iname "*libgs*" -name "*.apk" -exec cp {} output/ \; 2>/dev/null
          find sdk/bin/ -iname "*gutenprint*" -name "*.apk" -exec cp {} output/ \; 2>/dev/null
          
          echo "=== 产物列表 ==="
          ls -lh output/
          
          APK_COUNT=$(ls output/*.apk 2>/dev/null | wc -l)
          echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::未找到任何 apk 产物"
            exit 1
          fi

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cups-hybrid-feed-${{ env.OPENWRT_VERSION }}-x86_64
          path: output/
          retention-days: 30

      - name: 生成 Release 说明
        if: ${{ github.event.inputs.create_release == 'true' || github.event_name == 'push' }}
        run: |
          cat > release.txt << EOF
          ## CUPS for OpenWrt ${{ env.OPENWRT_VERSION }} (x86_64) — 混合 feed 版
          
          ### 编译信息
          | 项目 | 值 |
          |------|-----|
          | OpenWrt 版本 | ${{ env.OPENWRT_VERSION }} |
          | 目标平台 | x86/64 |
          | 包格式 | apk |
          | 产物数量 | ${{ steps.collect.outputs.apk_count }} 个 |
          
          ### Feed 来源（混合模式）
          | Feed | 地址 | 提供的包 |
          |------|------|----------|
          | OpenWrt 23.05 官方 | openwrt/packages.git;openwrt-23.05 | cups, cups-filters, ghostscript |
          | coolsnowwolf | coolsnowwolf/packages.git | gutenprint（官方源缺失） |
          
          ### 为什么用混合 feed？
          OpenWrt 23.05 官方 packages feed 中**没有 gutenprint 包**，
          因此使用 coolsnowwolf feed 补充 gutenprint，其余包从官方 23.05 feed 获取。
          
          ### 包含的软件包
          - \`cups\` - CUPS 打印系统核心（IPP 服务端）
          - \`libcups\` - CUPS 共享库
          - \`cups-filters\` - CUPS 过滤器
          - \`ghostscript\` - PostScript/PDF 渲染引擎
          - \`gutenprint\` - 打印机驱动（含佳能 PIXMA iP1180）
          
          ### 安装方法
          \`\`\`bash
          scp *.apk root@192.168.1.1:/tmp/
          ssh root@192.168.1.1
          cd /tmp
          opkg install libcups*.apk
          opkg install ghostscript*.apk
          opkg install gutenprint*.apk
          opkg install cups-filters*.apk
          opkg install cups*.apk
          /etc/init.d/cupsd enable
          /etc/init.d/cupsd start
          \`\`\`
          
          > 自动编译于 GitHub Actions
          > 编译时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          cat release.txt

      - name: 发布到 GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: cups-hybrid-feed-${{ env.OPENWRT_VERSION }}-x86_64
          name: CUPS (混合 feed) for OpenWrt ${{ env.OPENWRT_VERSION }} (x86_64)
          body_path: release.txt
          files: output/*.apk
          draft: false
          prerelease: false
          overwrite_files: false
          fail_on_unmatched_files: true
